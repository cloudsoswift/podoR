name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 테스트 설정은 private 서브모듈(podoR-config)에 있으므로, 테스트용 yml 만 secret 으로 받는다.
      - name: Restore test config
        env:
          TEST_APPLICATION_YML: ${{ secrets.TEST_APPLICATION_YML }}
        run: |
          if [ -z "$TEST_APPLICATION_YML" ]; then
            echo "::error::TEST_APPLICATION_YML secret 이 없습니다 (base64 -w0 backend/src/test/resources/application.yml 결과를 등록하세요)"
            exit 1
          fi
          # 이 폴더의 파일은 전부 gitignore 대상이라 클린 checkout 에는 폴더 자체가 없다
          mkdir -p src/test/resources
          printf '%s' "$TEST_APPLICATION_YML" | base64 -d > src/test/resources/application.yml

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci
