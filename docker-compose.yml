# =====================================================================
# 컨테이너 6종: nginx · postgres · redis · spring · next · jenkins
#
# 단일 오리진 구성: nginx 가 443 하나로 TLS 종단 후
#   /      -> next(3000),  /api/ -> spring(8080)
# spring/next 는 외부 포트를 열지 않고 nginx 뒤에서만 접근된다.
#
# 사용:
#   1) cp .env.example .env  후 값 채우기
#   2) git submodule update --init          # config submodule 체크아웃
#   3) certs/tls.crt, certs/tls.key 준비 (`tailscale cert` 결과)
#   4) docker compose up -d --build
#
# 주의:
#   - NEXT_PUBLIC_API_URL 은 next build 시점에 브라우저 번들에 박히므로 build arg 로 주입한다.
#     (runtime environment 로는 안 먹는다.) 단일 오리진이므로 값은 `https://<host>/api` 형태.
#   - postgres 는 최초 기동 시 backend/db/schema.sql 로 스키마를 자동 생성한다(빈 볼륨일 때만).
# =====================================================================
services:
  postgres:
    image: postgres:16
    container_name: home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 최초 기동(빈 볼륨) 시에만 실행됨. 이미 데이터가 있으면 무시된다.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: home-redis
    restart: unless-stopped
    networks: [app-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  spring:
    build:
      context: ./backend
    container_name: home-spring
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      # 컨테이너 네트워크에서는 서비스명(postgres/redis)이 호스트가 된다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=podor
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Spring Boot 3.0 에서 Redis 프로퍼티가 spring.redis.* -> spring.data.redis.* 로 이동(구 키 제거).
      # https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0.0-M5-Configuration-Changelog
      # relaxed binding: SPRING_DATA_REDIS_HOST -> spring.data.redis.host
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 외부 포트 노출 안 함 — nginx 프록시 뒤에서 spring:8080 으로만 접근
    networks: [app-net]

  next:
    build:
      context: ./frontend
      args:
        # 브라우저가 백엔드를 호출할 주소. next build 에 박힌다.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: home-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - spring
    # 외부 포트 노출 안 함 — nginx 프록시 뒤에서 next:3000 으로만 접근
    networks: [app-net]

  nginx:
    image: nginx:1.27
    container_name: home-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # tls.crt / tls.key (git 미추적)
    depends_on:
      - spring
      - next
    networks: [app-net]

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: home-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # 호스트 도커로 이미지 빌드/배포(Docker-out-of-Docker). 편의용.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [app-net]

volumes:
  postgres_data:
  jenkins_home:

networks:
  app-net:
