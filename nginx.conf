# =====================================================================
# podoR 단일 오리진 리버스 프록시 (443 하나로 종단)
#   /      -> next:3000    (프론트)
#   /api/  -> spring:8080  (백엔드, Spring server.servlet.context-path=/api)
#
# - TLS 종단은 여기서. 인증서는 certs/ 에 tls.crt / tls.key (호스트명 무관 generic 이름).
#     server에서는 `tailscale cert <host>` 결과를 certs/tls.crt, certs/tls.key 로 복사.
# - 이를 적용하면 FE, BE 모두 단일 오리진이라 CORS/크로스사이트 쿠키 이슈가 없음.
# =====================================================================

# 만약 WebSocket/스트리밍 사용할 경우, 업그레이드 지원 (http 컨텍스트)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# http -> https 리다이렉트 (선택)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 10m;   # 프로필 이미지 등 업로드 여유

    # 백엔드: `/api/*` 요청을 spring 서버로 전달
    location /api/ {
        proxy_pass http://spring:8080;
        # reverse proxy로 인한 정보 유실 방지 위해 X-Forwarded-* 헤더 설정
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 프론트: `/api/*`를 제외한 나머지 요청들 전부 next.js 서버로
    location / {
        proxy_pass http://next:3000;
        proxy_set_header Host              $host;
        # reverse proxy로 인한 정보 유실 방지 위해 X-Forwarded-* 헤더 설정
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
