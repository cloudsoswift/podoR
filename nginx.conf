# =====================================================================
# podoR 단일 오리진 리버스 프록시 (443 하나로 종단)
#   /      -> next:3000    (프론트)
#   /api/  -> spring:8080  (백엔드, Spring server.servlet.context-path=/api)
#   /media/ -> media 볼륨   (HLS·VOD. auth_request 로 관람 쿠키를 Spring 에 확인)
#
# - TLS 종단은 여기서. 인증서는 certs/ 에 tls.crt / tls.key (호스트명 무관 generic 이름).
#     server에서는 `tailscale cert <host>` 결과를 certs/tls.crt, certs/tls.key 로 복사.
# - 이를 적용하면 FE, BE 모두 단일 오리진이라 CORS/크로스사이트 쿠키 이슈가 없음.
# =====================================================================

# 만약 WebSocket/스트리밍 사용할 경우, 업그레이드 지원 (http 컨텍스트)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";  # close → "" : 일반 요청은 연결을 유지(업그레이드 요청만 upgrade)
}

# 업스트림 연결 재사용. 만약 아래 구문이 없다면, 요청마다 새 TCP 연결을 맺기 때문에 정점 부하에서 
# nginx의 임시 포트가 `TIME_WAIT`로 고갈된다(502, errno 99).
upstream spring_backend {
    server spring:8080;
    keepalive 64;              # 워커당 유지할 유휴 연결 수
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

upstream next_frontend {
    server next:3000;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# 미디어 캐시: 재생목록(.m3u8)은 라이브 중 계속 바뀌므로 캐시하지 않는다.
# 조각·VOD 는 쿠키로 보호되는 개인 응답이라 private 으로만.
map $uri $media_cache_control {
    ~\.m3u8$ "no-cache";
    default   "private, max-age=3600";
}

# http -> https 리다이렉트 (선택)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 10m;   # 프로필 이미지 등 업로드 여유

    # 내부 콜백(MediaMTX·nginx 전용)은 외부에서 접근할 수 없게 막는다.
    location /api/internal/ {
        return 404;
    }

    # 관람 쿠키 검사(auth_request 하위 요청 전용). 2xx 면 통과, 401/403 은 그대로 거부.
    # 하위 요청 안의 $uri 는 /_media_auth 자신이므로, 원래 경로는 본 요청이 담아 둔 $media_uri 로 넘긴다.
    # ($request_uri 는 디코딩 전 원문이라 %2e%2e 로 `..` 검사를 우회할 수 있어 쓰지 않는다)
    location = /_media_auth {
        internal;
        proxy_pass http://spring_backend/api/internal/media/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # 지정하지 않으면 Host 가 업스트림 이름(spring_backend)이 되고, Tomcat 은 '_' 가 든 호스트를 400 으로 거부한다.
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $media_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # HLS(/media/hls/{eventId}/{sessionNo}/…) · VOD(/media/vod/{eventId}.mp4)
    location /media/ {
        set $media_uri $uri;   # rewrite 단계(auth_request 보다 먼저). 정규화된 경로를 하위 요청에 넘긴다
        auth_request /_media_auth;
        alias /srv/media/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
            video/mp4                     mp4;
        }
        add_header Cache-Control $media_cache_control;
    }

    # 백엔드: `/api/*` 요청을 spring 서버로 전달
    location /api/ {
        proxy_pass http://spring_backend;
        # reverse proxy로 인한 정보 유실 방지 위해 X-Forwarded-* 헤더 설정
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 프론트: `/api/*`를 제외한 나머지 요청들 전부 next.js 서버로
    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host              $host;
        # reverse proxy로 인한 정보 유실 방지 위해 X-Forwarded-* 헤더 설정
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
